[package]
name = "qr_native"
version = "0.2.3"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Fast, customizable QR rendering for Node.js"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.cargo]
unused_dependencies = "deny"

[profile.release]
codegen-units = 1
lto = "thin"

[dependencies]
ab_glyph = "0.2.32"
napi = { version = "3.16.3", default-features = false, features = ["napi10"] }
napi-derive = "3.7.2"
zlib-rs = { version = "0.6.9", default-features = false, features = ["std"] }

[build-dependencies]
napi-build = "2.7.0"

[dev-dependencies]
qrcodegen = "1.8.0"
